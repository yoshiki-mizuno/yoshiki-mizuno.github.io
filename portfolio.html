<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <style>
    html {
         overflow-y: scroll;
    }
    * {
      box-sizing: border-box;
    }
    body {
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Segoe UI", sans-serif;
      background-color: #14315f;
      color: #061530;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 680px;
      margin: 70px auto;
      padding: 0 20px;
    }
    .welcome {
      font-family: "Times New Roman", serif;
      font-style: italic;
      font-size: 32px;
      color: #ffffff;
      letter-spacing: 0.02em;
      margin: 0 0 28px 8px;
    }
    nav {
      display: flex;
      gap: 4px;
      padding-left: 8px;
    }
    nav a {
      display: inline-block;
      padding: 12px 32px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.08em;
      color: #b9c9e6;
      background-color: #061530;
      border-radius: 10px 10px 0 0;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    nav a:hover {
      color: #ffffff;
    }
    nav a.active {
      background-color: #ffffff;
      color: #061530;
    }
    .card {
      background-color: #ffffff;
      border-radius: 0 16px 16px 16px;
      padding: 56px 56px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      text-align: center;
    }
    .construction {
      font-size: 15px;
      color: #4a6491;
      letter-spacing: 0.05em;
      margin: 20px 0;
    }
  </style>
</head>
<body>

  <div class="container">

    <p class="welcome">Welcome to Yoshiki Mizuno’s website!</p>

    <nav>
      <a href="index.html">Profile</a>
      <a href="portfolio.html" class="active">Portfolio</a>
    </nav>

    <div class="card">
      <p class="construction">ただいま工事中です。</p>
    </div>

  </div>

</body>
</html>
